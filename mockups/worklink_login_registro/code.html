<!-- Logo Section -->
<header class="flex flex-col items-center justify-center gap-stack-md mb-stack-lg">
<div class="w-24 h-24 mb-stack-md">
<img alt="Collawork Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC29kmRYZUfX3-5bfwiswDbUfIAnQHMn-k4VhlXF_lXQA0zE3ZOfk59ElG6ec4t_Pjw_iMo7XJfvc4BI3j6z4yJQERykkWPhqaJ_2Fb-8ye4t83veZgBylCQylGXDEr_Y8S4DqrvPil39aqnvs5v6ceWo0GsdTPXcWxR_ev2ropIRlzr759SPUAQ6kuKzU2bOSTsLZJO-36-IBJZpuiAkUtvJ0gK87EQ1m3pZYetgpo_tU2-Nc4yvnjiw">

<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-center md:hidden text-on-surface">Welcome to Collawork</h1>
<p class="text-body-md font-body-md text-on-surface-variant text-center">Connect with your professional network.</p>
</header>
<!-- Form Section -->
<form class="flex flex-col gap-stack-md w-full">
<!-- Email Input -->
<div class="flex flex-col gap-stack-sm">
<label class="text-label-md font-label-md text-on-surface-variant" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-outline-variant pointer-events-none" data-icon="mail">mail</span>
<input class="w-full pl-10 pr-3 py-3 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary input-glow text-body-md font-body-md text-on-surface transition-colors duration-200" id="email" name="email" placeholder="Enter your email" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-stack-sm">
<div class="flex justify-between items-center">
<label class="text-label-md font-label-md text-on-surface-variant" for="password">Password</label>
<a class="text-label-md font-label-md text-primary hover:text-on-primary-fixed-variant transition-colors duration-200" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-outline-variant pointer-events-none" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-3 py-3 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary input-glow text-body-md font-body-md text-on-surface transition-colors duration-200" id="password" name="password" placeholder="Enter your password" required="" type="password">
</div>
</div>

<button class="w-full bg-primary text-on-primary py-3 px-6 rounded text-label-md font-label-md hover:bg-on-primary-fixed-variant transition-colors duration-200 flex justify-center items-center gap-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-sm" data-icon="login">login</span>
</button>
<div class="relative flex items-center justify-center py-2">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative px-4 bg-surface-container-lowest text-label-sm font-label-sm text-on-surface-variant uppercase tracking-wider">Or</div>
</div>
