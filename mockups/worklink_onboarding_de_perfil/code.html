<script>
        function addSkill(input) {
            const val = input.value.trim();
            if (val) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'chip chip-selected px-3 py-1 rounded text-label-md font-label-md transition-colors';
                btn.textContent = val;
                btn.onclick = function() {
                    this.classList.toggle('chip-selected');
                    this.classList.toggle('text-on-surface-variant');
                    if(!this.classList.contains('chip-selected')) {
                        this.className = 'chip px-3 py-1 rounded text-label-md font-label-md text-on-surface-variant transition-colors hover:bg-surface-variant';
                    } else {
                         this.className = 'chip chip-selected px-3 py-1 rounded text-label-md font-label-md transition-colors';
                    }
                };
                
                input.parentElement.parentNode.insertBefore(btn, input.parentElement);
                input.value = '';
            }
        }
    </script>
